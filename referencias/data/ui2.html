<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ESP32 Servo + Stepper</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:14px;background:#0b0f14;color:#e6edf3}
    .card{background:#111826;border:1px solid #233044;border-radius:14px;padding:14px;margin:10px 0}
    h2{margin:0 0 10px 0;font-size:18px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    button{padding:10px 12px;border-radius:12px;border:1px solid #2b3b55;background:#162235;color:#e6edf3;font-weight:600}
    button.on{background:#1c3b2a;border-color:#2d6a4f}
    button.off{background:#3b1c1c;border-color:#6a2d2d}
    label{display:block;margin:10px 0 6px 0;color:#9fb3c8;font-size:13px}
    input[type=range]{width:100%}
    .small{color:#9fb3c8;font-size:13px}
    .kv{font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #2b3b55;border-radius:999px;margin-left:8px;color:#9fb3c8;font-size:12px}
    a{color:#9fb3c8}
  </style>
</head>
<body>
  <div class="card">
    <h2>Conexión <span class="pill">AP: ESP32_TEST</span> <span class="pill">IP: 192.168.4.1</span></h2>
    <div class="small">Control unificado: Servo Drive (LEDC) + Stepper (esp_timer). <a href="/" target="_blank">Abrir CAN UI</a></div>
  </div>

  <div class="card">
    <h2>Servo Drive (PULSE/DIR/SON)</h2>
    <div class="row">
      <button id="bSon">SON</button>
      <button id="bRunPulse">RUN PULSE</button>
      <button id="bServoDir">DIR</button>
    </div>

    <label>Frecuencia servo (Hz) <span id="servoHzLbl" class="pill"></span> <span id="servoHzRealLbl" class="pill"></span></label>
    <input id="servoHz" type="range" min="1" max="160000" value="1000" step="1"/>

    <label>Duty servo (%) <span id="servoDutyLbl" class="pill"></span></label>
    <input id="servoDuty" type="range" min="1" max="90" value="50" step="1"/>
  </div>

  <div class="card">
    <h2>Stepper (STEP/DIR)</h2>
    <div class="row">
      <button id="bStepRun">RUN</button>
      <button id="bStepDir">DIR</button>
      <button id="bStepRev">REV suave</button>
    </div>

    <label>Frecuencia stepper (Hz) <span id="stepHzLbl" class="pill"></span></label>
    <input id="stepHz" type="range" min="1" max="50000" value="200" step="1"/>

    <div class="small">REV suave: baja a ~200 Hz, cambia DIR, vuelve a subir.</div>
  </div>

  <div class="card">
    <h2>Status</h2>
    <div id="st" class="kv">...</div>
  </div>

<script>
const $ = (id)=>document.getElementById(id);

async function cmd(doCmd){
  try { await fetch(`/cmd?do=${encodeURIComponent(doCmd)}`); } catch(e){}
}

async function setParams(p){
  const qs = new URLSearchParams(p).toString();
  try { await fetch(`/set?${qs}`); } catch(e){}
}

let state = {
  servo_son:false, servo_run:false, servo_dir:0,
  servo_hz:1000, servo_hz_real:1000, servo_duty_pct:50,
  step_run:false, step_dir:0, step_hz:200, step_rev_busy:false,
};

function paint(){
  $("bSon").className = state.servo_son ? "on":"off";
  $("bSon").textContent = state.servo_son ? "SON: ON":"SON: OFF";

  $("bRunPulse").className = state.servo_run ? "on":"off";
  $("bRunPulse").textContent = state.servo_run ? "RUN PULSE: ON":"RUN PULSE: OFF";

  $("bServoDir").className = state.servo_dir ? "on":"off";
  $("bServoDir").textContent = state.servo_dir ? "DIR: 1":"DIR: 0";

  $("servoHzLbl").textContent = `${state.servo_hz} Hz`;
  $("servoHzRealLbl").textContent = `real ${Number(state.servo_hz_real).toFixed(1)} Hz`;
  $("servoDutyLbl").textContent = `${state.servo_duty_pct} %`;

  $("bStepRun").className = state.step_run ? "on":"off";
  $("bStepRun").textContent = state.step_run ? "RUN: ON":"RUN: OFF";

  $("bStepDir").className = state.step_dir ? "on":"off";
  $("bStepDir").textContent = state.step_dir ? "DIR: 1":"DIR: 0";

  $("bStepRev").className = state.step_rev_busy ? "off":"on";
  $("bStepRev").textContent = state.step_rev_busy ? "REV (busy)":"REV suave";

  $("stepHzLbl").textContent = `${state.step_hz} Hz`;

  if (!dragServoHz) $("servoHz").value = state.servo_hz;
  if (!dragServoDuty) $("servoDuty").value = state.servo_duty_pct;
  if (!dragStepHz) $("stepHz").value = state.step_hz;

  $("st").textContent = JSON.stringify(state, null, 2);
}

async function refresh(){
  try{
    const r = await fetch("/status");
    const j = await r.json();
    state = j;
    paint();
  }catch(e){}
}

$("bSon").onclick = async ()=>{
  await cmd(state.servo_son ? "servo_son_off":"servo_son_on");
  setTimeout(refresh, 120);
};

$("bRunPulse").onclick = async ()=>{
  await cmd(state.servo_run ? "servo_run_off":"servo_run_on");
  setTimeout(refresh, 120);
};

$("bServoDir").onclick = async ()=>{
  await cmd(state.servo_dir ? "servo_dir_0":"servo_dir_1");
  setTimeout(refresh, 120);
};

$("bStepRun").onclick = async ()=>{
  await cmd(state.step_run ? "step_run_off":"step_run_on");
  setTimeout(refresh, 120);
};

$("bStepDir").onclick = async ()=>{
  await cmd(state.step_dir ? "step_dir_0":"step_dir_1");
  setTimeout(refresh, 180);
};

$("bStepRev").onclick = async ()=>{
  await cmd("step_rev");
  setTimeout(refresh, 150);
};

let dragServoHz=false, dragServoDuty=false, dragStepHz=false;

$("servoHz").addEventListener("input", ()=>{
  dragServoHz = true;
  $("servoHzLbl").textContent = `${$("servoHz").value} Hz`;
});
$("servoHz").addEventListener("change", async ()=>{
  dragServoHz = false;
  await setParams({servo_hz: $("servoHz").value});
  setTimeout(refresh, 120);
});

$("servoDuty").addEventListener("input", ()=>{
  dragServoDuty = true;
  $("servoDutyLbl").textContent = `${$("servoDuty").value} %`;
});
$("servoDuty").addEventListener("change", async ()=>{
  dragServoDuty = false;
  await setParams({servo_duty: $("servoDuty").value});
  setTimeout(refresh, 120);
});

$("stepHz").addEventListener("input", ()=>{
  dragStepHz = true;
  $("stepHzLbl").textContent = `${$("stepHz").value} Hz`;
});
$("stepHz").addEventListener("change", async ()=>{
  dragStepHz = false;
  await setParams({step_hz: $("stepHz").value});
  setTimeout(refresh, 120);
});

refresh();
setInterval(refresh, 800);
</script>
</body>
</html>
